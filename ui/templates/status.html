<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Status — VyanaWatch</title>
<style>
:root {
  --bg: #f6f8fa;
  --surface: #fff;
  --surface2: #f1f3f5;
  --border: #e2e8f0;
  --text: #1a202c;
  --text2: #64748b;
  --green: #22c55e;
  --green-bg: #f0fdf4;
  --green-border: #bbf7d0;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --orange: #f59e0b;
  --orange-bg: #fffbeb;
  --orange-border: #fde68a;
  --blue: #3b82f6;
  --blue-bg: #eff6ff;
  --blue-border: #bfdbfe;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.08);
  --radius: 12px;
  --radius-sm: 8px;
}
html.dark {
  --bg: #0b1121;
  --surface: #1a2332;
  --surface2: #1e293b;
  --border: #2d3a4e;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --green-bg: #052e16;
  --green-border: #166534;
  --red-bg: #450a0a;
  --red-border: #991b1b;
  --orange-bg: #451a03;
  --orange-border: #92400e;
  --blue-bg: #172554;
  --blue-border: #1e40af;
  --shadow: 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.3);
}
*,:after,:before{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}

/* NAV */
.nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 32px;height:60px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:50;
}
.nav-l{display:flex;align-items:center;gap:16px}
.nav-logo{font-size:20px;font-weight:800;color:var(--green);letter-spacing:-.5px}
.nav-logo span{color:var(--text)}
.nav-r{display:flex;align-items:center;gap:10px}

.btn-icon{
  width:36px;height:36px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);color:var(--text2);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.btn-icon:hover{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.btn-icon svg{width:17px;height:17px}
@media(max-width:640px){.hamburger{display:flex}}

/* Sidebar drawer (status page) */
.sp-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);
  z-index:100;opacity:0;transition:opacity .25s ease;
}
.sp-overlay.show{display:block;opacity:1}
.sp-drawer{
  position:fixed;top:0;left:0;bottom:0;width:280px;
  background:var(--surface);z-index:110;
  transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  box-shadow:2px 0 12px rgba(0,0,0,.1);display:flex;flex-direction:column;
}
.sp-drawer.open{transform:translateX(0)}
.sp-drawer-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.sp-drawer-body{flex:1;padding:12px 0;overflow-y:auto}
.sp-drawer-link{
  display:flex;align-items:center;padding:12px 20px;
  font-size:14px;font-weight:500;color:var(--text);
  text-decoration:none;transition:background .15s;
}
.sp-drawer-link:hover{background:var(--bg)}

/* PAGE */
.page{max-width:960px;margin:0 auto;padding:40px 24px 100px}

/* HEADER */
.sp-hdr{margin-bottom:32px}
.sp-hdr h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.sp-hdr p{color:var(--text2);margin-top:6px;font-size:14px}
.sp-hdr .sp-meta{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--text2)}
.sp-hdr .sp-meta span{display:flex;align-items:center;gap:4px}

/* BANNER */
.banner{
  border-radius:var(--radius);padding:16px 20px;text-align:center;
  font-weight:600;font-size:14px;margin-bottom:28px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.banner.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.banner.down{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.banner .b-dot{
  width:10px;height:10px;border-radius:50%;display:inline-block;
  animation:pulse 2s infinite;
}
.banner.ok .b-dot{background:var(--green)}
.banner.down .b-dot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* TOOLBAR */
.tbar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.tbar .swrap{flex:1;min-width:180px;position:relative}
.tbar .swrap svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--text2);pointer-events:none;
}
.tbar input{
  width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text);
  outline:none;transition:border-color .2s;
}
.tbar input:focus{border-color:var(--green)}
.tbar select{
  padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13px;background:var(--surface);color:var(--text);cursor:pointer;outline:none;
}

/* SECTION LABEL */
.sec-label{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.sec-label:after{content:'';flex:1;height:1px;background:var(--border)}

/* CARDS */
.cards{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 24px;
  box-shadow:var(--shadow);transition:all .2s;
}
.card:hover{box-shadow:var(--shadow-lg);border-color:var(--green)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.card-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.card-name .tag{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;
  background:var(--surface2);color:var(--text2);text-transform:uppercase;letter-spacing:.3px;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 14px;
  border-radius:20px;font-size:12px;font-weight:600;
}
.badge .dot{width:8px;height:8px;border-radius:50%}
.badge.up{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge.up .dot{background:var(--green)}
.badge.down{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge.down .dot{background:var(--red)}
.badge.paused{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.badge.paused .dot{background:var(--orange)}
.badge.pending{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge.pending .dot{background:var(--blue)}

.card-meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text2);margin-bottom:12px;flex-wrap:wrap}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-meta .sep{color:var(--border)}

/* UPTIME RING */
.uptime-row{display:flex;align-items:center;gap:24px;margin-bottom:14px}
.uptime-pills{display:flex;gap:8px;flex-wrap:wrap}
.uptime-pill{
  display:flex;flex-direction:column;align-items:center;
  padding:6px 14px;border-radius:var(--radius-sm);background:var(--surface2);
  min-width:60px;
}
.uptime-pill .up-val{font-size:15px;font-weight:700}
.uptime-pill .up-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.uptime-pill.good .up-val{color:var(--green)}
.uptime-pill.warn .up-val{color:var(--orange)}
.uptime-pill.bad .up-val{color:var(--red)}

/* HEARTBEAT BAR */
.hb-wrap{position:relative}
.hb-bar{display:flex;gap:2px;height:36px;align-items:flex-end;position:relative}
.hb-bar .tick{
  flex:1;border-radius:3px 3px 0 0;min-height:4px;cursor:pointer;
  position:relative;transition:opacity .2s;
}
.hb-bar .tick.up{background:linear-gradient(180deg,#4ade80,#22c55e);height:100%}
.hb-bar .tick.down{background:linear-gradient(180deg,#f87171,#ef4444);height:100%}
.hb-bar .tick.empty{background:var(--surface2);height:25%}
.hb-bar .tick:hover{opacity:.7 !important}
.hb-range{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px}

/* TOOLTIP */
.tooltip{
  position:fixed;z-index:1000;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:240px;
  box-shadow:var(--shadow-lg);pointer-events:none;font-size:13px;line-height:1.5;display:none;
}
.tooltip .tt-row{display:flex;justify-content:space-between;padding:3px 0}
.tooltip .tt-lbl{color:var(--text2);font-size:12px}
.tooltip .tt-val{font-weight:600;font-size:12px}
.tooltip .tt-up{color:var(--green)}
.tooltip .tt-down{color:var(--red)}

/* FOOTER */
.sp-ftr{text-align:center;margin-top:40px;color:var(--text2);font-size:13px}
.sp-ftr a{color:var(--green);text-decoration:none;font-weight:600}

/* REFRESH */
.refresh-wrap{
  position:fixed;bottom:24px;left:24px;z-index:50;
  display:flex;align-items:center;gap:8px;
}
.refresh-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-lg);transition:all .2s;
}
.refresh-btn:hover{color:var(--text);transform:rotate(180deg)}
.refresh-btn svg{width:18px;height:18px}
.interval-picker{position:relative}
.interval-btn{
  padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--text);
  cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:6px;
  transition:all .2s;
}
.interval-btn:hover{box-shadow:var(--shadow-lg)}
.interval-btn svg{width:14px;height:14px;color:var(--text2)}
.interval-dropdown{
  position:absolute;bottom:48px;left:0;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow-lg);overflow:hidden;display:none;min-width:80px;
}
.interval-dropdown.open{display:block}
.iv-opt{
  padding:9px 18px;font-size:13px;cursor:pointer;color:var(--text);
  transition:background .15s;text-align:center;font-weight:500;
}
.iv-opt:hover{background:var(--bg)}
.iv-opt.active{background:var(--green-bg);color:var(--green);font-weight:700}

.loading{text-align:center;padding:80px;color:var(--text2);font-size:15px}
.error-msg{text-align:center;padding:80px;color:var(--red);font-size:15px}
.no-data{text-align:center;padding:40px;color:var(--text2);font-size:14px}
.countdown{font-size:12px;color:var(--text2);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}

@media(max-width:640px){
  .nav{padding:0 16px}
  .page{padding:24px 16px 100px}
  .tbar{flex-direction:column}
  .tbar .swrap{min-width:100%}
  .uptime-row{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <div class="nav-l">
    <button class="btn-icon hamburger" id="spHamburger" onclick="toggleSpSidebar()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="nav-logo"><span>Vyana</span>Watch</span>
  </div>
  <div class="nav-r">
    <button class="btn-icon" id="darkToggle" title="Toggle theme">
      <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<!-- Sidebar overlay (mobile) -->
<div class="sp-overlay" id="spOverlay" onclick="toggleSpSidebar()"></div>
<!-- Sidebar drawer -->
<div class="sp-drawer" id="spDrawer">
  <div class="sp-drawer-header">
    <span class="nav-logo"><span>Vyana</span>Watch</span>
    <button class="btn-icon" onclick="toggleSpSidebar()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sp-drawer-body" id="spDrawerBody">
    <a class="sp-drawer-link" href="/">Dashboard</a>
    <a class="sp-drawer-link" href="/status/my-status">Status Page</a>
  </div>
</div>

<!-- Page -->
<div class="page">
  <div class="sp-hdr">
    <h1 id="spName">Status</h1>
    <p id="spDesc"></p>
    <div class="sp-meta">
      <span id="spMonCount"></span>
      <span id="spUptime"></span>
    </div>
  </div>

  <div id="banner"></div>

  <div class="tbar">
    <div class="swrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search endpoints...">
    </div>
    <select id="filterSelect">
      <option value="">All statuses</option>
      <option value="up">Healthy</option>
      <option value="down">Unhealthy</option>
      <option value="paused">Paused</option>
    </select>
    <select id="sortSelect">
      <option value="name">Name</option>
      <option value="status">Status</option>
      <option value="latency">Latency</option>
    </select>
  </div>

  <div id="downSection" style="display:none">
    <div class="sec-label" style="color:var(--red)">Unhealthy</div>
    <div class="cards" id="downCards"></div>
  </div>

  <div id="upSection">
    <div class="sec-label" style="color:var(--green)">Operational</div>
    <div class="cards" id="upCards"></div>
  </div>

  <div id="loadingState"><div class="loading">Loading status...</div></div>

  <div class="sp-ftr">
    Powered by <a href="#">VyanaWatch</a>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="refresh-wrap">
  <div class="interval-picker">
    <button class="interval-btn" id="intervalBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      <span id="intervalLabel">5m</span>
    </button>
    <div class="interval-dropdown" id="intervalDropdown">
      <div class="iv-opt" data-sec="10">10s</div>
      <div class="iv-opt" data-sec="30">30s</div>
      <div class="iv-opt" data-sec="60">1m</div>
      <div class="iv-opt active" data-sec="300">5m</div>
      <div class="iv-opt" data-sec="600">10m</div>
    </div>
  </div>
  <span class="countdown" id="countdown"></span>
  <button class="refresh-btn" id="refreshBtn" title="Refresh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
  </button>
</div>

<script>
(function(){
  const slug = window.location.pathname.split('/').pop();
  let allData = {monitors:[]};
  let refreshSec = 300;
  let remaining = 0;
  let timer;

  function initDark(){
    const s=localStorage.getItem('vw-dark');
    if(s==='true'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))
      document.documentElement.classList.add('dark');
    updIcons();
  }
  function toggleDark(){
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('vw-dark',document.documentElement.classList.contains('dark'));
    updIcons();
  }
  function updIcons(){
    const d=document.documentElement.classList.contains('dark');
    document.getElementById('sunIcon').style.display=d?'none':'block';
    document.getElementById('moonIcon').style.display=d?'block':'none';
  }
  document.getElementById('darkToggle').addEventListener('click',toggleDark);
  initDark();

  async function loadData(){
    try{
      const r=await fetch('/api/v1/status/'+encodeURIComponent(slug));
      if(!r.ok) throw new Error('Status page not found');
      const d=await r.json();
      allData=d;

      document.getElementById('spName').textContent=d.name||'Status';
      document.title=(d.name||'Status')+' — VyanaWatch';
      document.getElementById('spDesc').textContent=d.description||'';

      const mns=d.monitors||[];
      document.getElementById('spMonCount').innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> '+mns.length+' endpoints';

      let totalUp=0,totalLatency=0,latCount=0;
      mns.forEach(m=>{if(m.status==='up'){totalUp++;if(m.uptime_stats?.avg_latency){totalLatency+=m.uptime_stats.avg_latency;latCount++}}});
      const uptimePct=mns.length?Math.round(totalUp/mns.length*100):100;
      const avgLat=latCount?Math.round(totalLatency/latCount):0;
      document.getElementById('spUptime').innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> '+uptimePct+'% uptime, ~'+avgLat+'ms avg';

      renderBanner(mns);
      applyFilters();
      remaining=refreshSec;
    }catch(e){
      document.getElementById('loadingState').innerHTML='<div class="error-msg">'+esc(e.message)+'</div>';
    }
  }

  function renderBanner(mns){
    const down=mns.filter(m=>m.status==='down').length;
    const paused=mns.filter(m=>m.status==='paused').length;
    let html='';
    if(down>0){
      html='<div class="banner down"><span class="b-dot"></span> '+down+' endpoint'+(down>1?'s are':' is')+' experiencing issues'+(paused?', '+paused+' paused':'')+'</div>';
    }else if(paused===mns.length&&mns.length>0){
      html='<div class="banner" style="background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border)"><span class="b-dot" style="background:var(--orange)"></span> All endpoints are paused</div>';
    }else{
      html='<div class="banner ok"><span class="b-dot"></span> All systems operational</div>';
    }
    document.getElementById('banner').innerHTML=html;
  }

  function applyFilters(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const filter=document.getElementById('filterSelect').value;
    const sort=document.getElementById('sortSelect').value;

    let list=allData.monitors.filter(m=>{
      if(q&&!m.name.toLowerCase().includes(q)&&!(m.url||'').toLowerCase().includes(q)&&!(m.hostname||'').toLowerCase().includes(q)) return false;
      if(filter&&m.status!==filter) return false;
      return true;
    });

    if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sort==='status') list.sort((a,b)=>(a.status==='down'?0:a.status==='paused'?1:2)-(b.status==='down'?0:b.status==='paused'?1:2));
    else if(sort==='latency') list.sort((a,b)=>(a.uptime_stats?.avg_latency||9999)-(b.uptime_stats?.avg_latency||9999));

    const down=list.filter(m=>m.status==='down');
    const up=list.filter(m=>m.status!=='down');

    document.getElementById('downSection').style.display=down.length?'block':'none';
    document.getElementById('downCards').innerHTML=renderCards(down);
    document.getElementById('upCards').innerHTML=renderCards(up);
    document.getElementById('loadingState').innerHTML='';
  }

  function renderCards(list){
    if(list.length===0) return '<div class="no-data">No endpoints match</div>';

    return list.map((m,i)=>{
      const s=m.status||'pending';
      const lbl=s==='up'?'Healthy':s==='down'?'Unhealthy':s==='paused'?'Paused':'Pending';
      const target=m.url||m.hostname||'—';
      const st=m.uptime_stats||{};
      const lat=st.avg_latency!=null?Math.round(st.avg_latency)+'ms':'—';
      const u24=st.uptime_24h!=null?st.uptime_24h.toFixed(1):'—';
      const u7d=st.uptime_7d!=null?st.uptime_7d.toFixed(1):'—';
      const u30=st.uptime_30d!=null?st.uptime_30d.toFixed(1):'—';

      const hb=m.recent_heartbeats||[];
      const tickN=50;
      let ticks='';
      for(let j=0;j<tickN;j++){
        const beat=hb[j];
        const cls=beat?(beat.status==='up'?'up':'down'):'empty';
        const attr=beat?' data-b=\''+JSON.stringify({ts:beat.created_at,rt:beat.response_time,st:beat.status,sc:beat.status_code||0}).replace(/'/g,'&#39;')+'\'':'';
        ticks+='<div class="tick '+cls+'" style="animation-delay:'+(j*12)+'ms"'+attr+'></div>';
      }
      const oldest=hb.length?timeAgo(hb[0].created_at):'';
      const newest=hb.length?timeAgo(hb[hb.length-1].created_at):'';

      const upClass=u24>=99.9?'good':u24>=95?'warn':'bad';

      return '<div class="card">'+
        '<div class="card-top">'+
          '<span class="card-name">'+esc(m.name)+'</span>'+
          '<span class="badge '+s+'"><span class="dot"></span>'+lbl+'</span>'+
        '</div>'+
        '<div class="card-meta">'+
          '<span>'+m.type+'</span><span class="sep">|</span>'+
          '<span>'+esc(target)+'</span><span class="sep">|</span>'+
          '<span>'+lat+'</span>'+
        '</div>'+
        '<div class="uptime-row">'+
          '<div class="uptime-pills">'+
            '<div class="uptime-pill '+upClass+'"><span class="up-val">'+u24+'%</span><span class="up-lbl">24h</span></div>'+
            '<div class="uptime-pill '+upClass+'"><span class="up-val">'+u7d+'%</span><span class="up-lbl">7d</span></div>'+
            '<div class="uptime-pill '+upClass+'"><span class="up-val">'+u30+'%</span><span class="up-lbl">30d</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="hb-wrap">'+
          '<div class="hb-bar">'+ticks+'</div>'+
          '<div class="hb-range"><span>'+oldest+'</span><span>'+newest+'</span></div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  const tooltip=document.getElementById('tooltip');
  document.addEventListener('mouseover',function(e){
    const t=e.target.closest('.tick');
    if(!t||!t.dataset.b){tooltip.style.display='none';return;}
    const d=JSON.parse(t.dataset.b);
    const dt=new Date(d.ts);
    const ts=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())+' '+pad(dt.getHours())+':'+pad(dt.getMinutes())+':'+pad(dt.getSeconds());
    const up=d.st==='up';

    tooltip.innerHTML=
      '<div class="tt-row"><span class="tt-lbl">Time</span><span class="tt-val '+(up?'tt-up':'tt-down')+'">'+ts+'</span></div>'+
      '<div class="tt-row"><span class="tt-lbl">Response</span><span class="tt-val">'+(d.rt||0)+'ms</span></div>'+
      '<div class="tt-row"><span class="tt-lbl">Status</span><span class="tt-val '+(up?'tt-up':'tt-down')+'">'+(d.sc||'—')+' '+(up?'OK':'DOWN')+'</span></div>';
    tooltip.style.display='block';
    pos(t);
  });
  document.addEventListener('mouseout',function(e){if(e.target.closest('.tick'))tooltip.style.display='none'});
  function pos(el){
    const r=el.getBoundingClientRect();
    const tw=tooltip.offsetWidth,th=tooltip.offsetHeight;
    let l=r.left+r.width/2-tw/2,t=r.top-th-10;
    if(t<8)t=r.bottom+10;
    if(l<8)l=8;
    if(l+tw>window.innerWidth-8)l=window.innerWidth-tw-8;
    tooltip.style.left=l+'px';tooltip.style.top=t+'px';
  }

  function pad(n){return String(n).padStart(2,'0')}
  function timeAgo(d){
    const s=Math.floor((Date.now()-new Date(d).getTime())/1000);
    if(s<60)return s+'s ago';
    if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }
  function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

  // Events
  document.getElementById('searchInput').addEventListener('input',applyFilters);
  document.getElementById('filterSelect').addEventListener('change',applyFilters);
  document.getElementById('sortSelect').addEventListener('change',applyFilters);
  document.getElementById('refreshBtn').addEventListener('click',function(){loadData();remaining=refreshSec});

  // Interval picker
  const iBtn=document.getElementById('intervalBtn');
  const iDrop=document.getElementById('intervalDropdown');
  const iLbl=document.getElementById('intervalLabel');
  iBtn.addEventListener('click',function(e){e.stopPropagation();iDrop.classList.toggle('open')});
  document.addEventListener('click',function(){iDrop.classList.remove('open')});
  iDrop.querySelectorAll('.iv-opt').forEach(function(o){
    o.addEventListener('click',function(e){
      e.stopPropagation();
      refreshSec=parseInt(this.dataset.sec);remaining=refreshSec;
      iLbl.textContent=this.textContent;
      iDrop.querySelectorAll('.iv-opt').forEach(function(x){x.classList.remove('active')});
      this.classList.add('active');iDrop.classList.remove('open');
    });
  });

  // Countdown
  const cdEl=document.getElementById('countdown');
  function tick(){
    if(remaining>0)remaining--;
    cdEl.textContent=formatTime(remaining);
    if(remaining<=0)loadData();
  }
  function formatTime(s){const m=Math.floor(s/60);const sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}

  loadData();
  setInterval(tick,1000);
})();

function toggleSpSidebar(){
  document.getElementById('spDrawer').classList.toggle('open');
  document.getElementById('spOverlay').classList.toggle('show');
}
</script>
</body>
</html>
